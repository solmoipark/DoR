# Unit / basis harmonisation rules (spec §4.3). Target units:
#   mass quantities  -> g / 100 g anhydrous binder
#   chem_shrink      -> mL / g binder
#   DoR              -> fraction
# grade: A exact, B approximate (documented assumption), C strong assumption, D reference only, X excluded
# factor expressions use: f_opc = 1 - scm_total_pct/100, w_b, scm_pct (fraction of the resolved SCM), gypsum_frac (default 0.05)
#
# Matching (dorgems.db.units.harmonize): an explicit basis_reported wins; 'mass_percent_unspecified' /
# 'other' are D whatever unit_norm says (the DB normalises unit_norm to 'g/100 g binder' with the note
# "assumed to be per 100 g binder"). With a NULL basis the *reported* unit text is matched; anything
# unrecognised is D. Vocabulary below = every basis_reported value in scm_dor_enriched.db (2026-09-02)
# plus the frequent reported-unit strings seen with NULL basis.
mass_quantities: [CH_TGA, CH_XRD, bound_water]
rules:
  - match: ["g/100 g binder", "g/100 g anhydrous binder", "g_per_100g_binder", "g/100g binder", "g/100 g dry binder", "g/100 g solid binder", "wt% of binder", "% of binder", "% binder",
            "per g binder", "per g anhydrous binder", "per_100g_anhydrous_binder", "per 100 g binder", "per 100 g anhydrous binder",
            "g/100 g of anhydrous", "g/100g anhydrates", "g/100 g anhydrous", "g/100 g anhydrous material"]
    factor: "1"
    grade: A
  - match: ["g/100 g cement", "g/100 g PC", "g/100 g OPC", "g/100 g Portland cement", "g/100g cement", "% of cement", "wt% of cement", "g/100 g cement (unhydrated)",
            "per g cement", "per g PC", "per g OPC", "per 100 g cement", "per_100g_cement",
            "g water / 100 g CEM (%/g CEM as printed)", "g CH / 100 g CEM (% CH per g CEM)", "g/100 g CEM"]
    factor: "f_opc"
    grade: A
    assumption: "cement basis converted with f_OPC = 1 - scm_total_pct/100"
  - match: ["g/100 g clinker", "g/100g clinker", "% of clinker", "per g clinker", "per 100 g clinker"]
    factor: "f_opc * (1 - gypsum_frac)"
    grade: B
    assumption: "clinker basis ≈ f_OPC × (1 - gypsum fraction 0.05)"
  - match: ["g/100 g paste", "g/100 g dry paste", "g/100 g sample", "g/100 g hydrated paste", "g/100g paste", "wt% of paste", "% of paste", "% of sample", "g/100 g dried paste",
            "per g paste", "per g dry paste", "per_100g_paste", "per g sample", "per 100 g paste", "per g hydrated paste"]
    factor: "1 + w_b"
    grade: C
    assumption: "paste basis assumed = anhydrous binder + mixing water (×(1 + w/b)); if the basis was 105 °C-dried mass the factor is ×(1 + w_bound/100) instead"
  - match: ["per_100g_ignited", "g/100 g ignited", "g/100 g ignited binder", "% ignited", "g/100 g ignited paste", "% of ignited weight", "% by ignited mass", "per g ignited", "ignited basis"]
    factor: null
    grade: X
    assumption: "ignited basis needs the bound-water value of the same sample (circular) — excluded in v1"
  - match: ["g/100 g MK", "g/100 g SCM", "g/100 g slag", "g/100 g fly ash", "g/100 g SF", "% of SCM", "per g MK", "per g SCM", "per g slag", "per g fly ash"]
    factor: "scm_pct"
    grade: B
    assumption: "SCM-mass basis converted with the resolved SCM fraction"
  - match: ["mass_percent_unspecified", "%", "wt%", "wt.%", "wt. %", "other", "", null]
    factor: "1"
    grade: D
    assumption: "basis unspecified; treated as g/100 g binder for reference only (excluded from residual statistics)"
qxrd:
  - match: ["wt% (as reported)", "wt%", "%"]
    factor: "1"
    grade: C
    assumption: "QXRD basis unknown; compare phase ratios and trends only unless the paper states an anhydrous basis"
# chem_shrink: the DB's unit_norm is '%' for most rows and carries no information; the
# *reported* unit text decides (vocabulary = every unit_reported in the DB, 2026-09-02).
# Negative values (volume-change sign convention) are demoted to D by the code.
chem_shrink:
  - match: ["mL/g binder", "ml/g binder", "mL/g", "ml/g", "cm3/g binder", "cm3/g", "mL/g paste"]
    factor: "1"
    grade: A
  - match: ["mL/100 g binder", "ml/100 g binder", "cm3/100 g binder", "ml/100 g", "mL/100 g", "cm3/100g", "mL/100 g CM", "ml/100 g CM"]
    factor: "0.01"
    grade: A
  - match: ["mm3/g of binder", "mm3/g binder", "mm^3/g binder", "mm3/g"]
    factor: "0.001"
    grade: A
  - match: ["ml/g cement", "ml/g-cement", "mL/g cement", "mL/g OPC", "ml/g OPC"]
    factor: "f_opc"
    grade: A
    assumption: "cement basis converted with f_OPC = 1 - scm_total_pct/100"
  - match: ["mm^3/g OPC", "mm3/g OPC", "mm3/g cement", "mm^3/g cement"]
    factor: "0.001 * f_opc"
    grade: A
    assumption: "mm3 -> mL; cement basis converted with f_OPC"
  - match: ["mL/g slag", "mL/g SCM", "ml/g slag", "mL/g fly ash", "mL/g MK"]
    factor: "scm_pct"
    grade: B
    assumption: "SCM-mass basis converted with the resolved SCM fraction"
  - match: ["%", "vol%", "other", null]
    factor: null
    grade: D
    assumption: "chemical shrinkage in % has an unknown reference (paste volume? binder mass?)"
dor:
  - match: ["%", "percent"]
    factor: "0.01"
    grade: A
  - match: ["fraction"]
    factor: "1"
    grade: A
gypsum_frac_default: 0.05
