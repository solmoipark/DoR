# DoRGems runtime defaults (spec §3.2). Values here are read by the kernel; the LLM never edits them.
ages_d_default: [1, 3, 7, 28, 90, 180, 365]
ensemble:
  mode: bayes            # G1-3 (2026-09-02): blend MAE 11.37 vs bayes 11.43 but 90% coverage 0.77 < 0.85 -> bayes. See docs/gates.md
  anchors_d: [3, 7, 28, 90, 180]
  sigma_point_pct: 12.0
  ess_min: 100
posterior_draws: 2000
quantiles: [0.05, 0.5, 0.95]
logistic_fit:
  t_min_d: 0.25
  t_max_d: 730
  n_grid: 48
  fix_A_zero: true
  warn_dev_pct: 2.0
  fail_dev_pct: 5.0
  report_range_d: [1, 365]
alpha_grid:
  n_points: 21          # 0.00, 0.05, ..., 1.00
  refine_step: 0.025    # inside the prior 90% interval
budget:
  max_xgems_calls_hard_cap: 200   # real runs above this are refused (§11)
sigma_obs_default:
  CH_TGA: 1.5            # g/100 g binder
  CH_XRD: 1.5
  bound_water: 1.5
  chem_shrink: 0.005     # mL/g binder
  QXRD_phase: 2.0
sigma_model_initial:     # replaced by the M2 OPC reference check (G2-4); CH widened for the kernel's systematic bias
  CH_TGA: 5.0
  CH_XRD: 5.0
  bound_water: 3.0      # after the 0.60 scale: OPC reference residual MAD 3.2 g → σ ≈ 3 (G2-4)
  chem_shrink: 0.01
  QXRD_phase: 3.0
compare:
  consistent_frac_z_lt2: 0.7
  min_n: 5
  # Primary quantities decide the overall verdict; CH is secondary because the kernel
  # overestimates portlandite systematically (docs/kernel_ch_investigation.md, G2-3).
  primary_quantities: [bound_water, chem_shrink, QXRD_phase]
  secondary_quantities: [CH_TGA, CH_XRD]
# Likelihood policy for scenario C (2026-09-03 revision after G3-3):
#   weight   multiplies each observation's log-likelihood contribution
#   offset   b_q added to the model value (model − literature systematic bias; CH ≈ +3 g → −3)
#   scale    multiplies the model value before the offset: model_eff = scale·F + offset.
#            bound_water 0.60 = TGA non-evaporable water / thermodynamic bound water, measured on
#            the merged kernel: OPC-only 28 d reference 17.0/28.4 (10 papers, G2-4) and the slag twin
#            0.59 (G2-5) agree; chem_shrink left at 1 (4 obs / 2 papers only).
likelihood:
  quantity_weights: {bound_water: 1.0, chem_shrink: 1.0, QXRD_phase: 1.0, CH_TGA: 0.25, CH_XRD: 0.25}
  systematic_scales: {bound_water: 0.60, chem_shrink: 1.0, CH_TGA: 1.0, CH_XRD: 1.0}
  systematic_offsets: {CH_TGA: -3.0, CH_XRD: -3.0, bound_water: 0.0, chem_shrink: 0.0}
inverse:
  status: consistency_check   # G3-3 final (2026-09-03): hidden-DoR MAE 13.4 %p, coverage 0.62 overall; slag alone 8.7 %p / 0.70
  status_by_slot: {slag: provisional, fly_ash: unvalidated, metakaolin: consistency_check, silica_fume: unvalidated}
  status_note: "Scenario C is a consistency / uncertainty-reduction check, not a validated DoR estimator (docs/gates.md G3-3): overall MAE 13.4 %p, 90 % coverage 0.62 on 13 literature mixes; slag meets the MAE criterion (8.7 %p) but with an early-age low bias. Bound water (x0.60) and chemical shrinkage carry the likelihood; portlandite is down-weighted."
  ess_min: 50
  sir_rounds: 1
  flat_prior_grid: 40
  b_bw_marginal_points: 5
