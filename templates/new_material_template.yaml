# =====================================================================================
#  DoRGems 새 재료 입력 템플릿  (YAML)
#  채운 뒤:  dorgems validate <이 파일>          ← 스키마·단위 등급 검사 (계산 없음)
#           dorgems envelope --input <이 파일> --out out/A --db out/igdb   ← 시나리오 A
#           dorgems compare  --input <이 파일> --out out/B --db out/igdb   ← 관측값 대조 (관측값 있을 때)
#           dorgems infer    --input <이 파일> --out out/C --db out/igdb   ← 반응도 역추정 (관측값 있을 때)
#  실제 xGEMS 실행은 --real --dat-lst <MySystem-dat.lst> --max-xgems-calls 200 을 덧붙임.
#  '?' 로 표시한 값은 반드시 채우고, 모르는 선택 항목은 줄을 지우거나 null 로 둡니다.
# =====================================================================================

# ---------- 1. 재료 (필수) ----------
scm:
  name: "?"                     # 예: GGBS-Pohang-2026  (결과 파일·재료 별칭에 그대로 쓰임)
  role: "?"                     # slag | fly_ash | metakaolin | calcined_clay | silica_fume |
                                # limestone | natural_pozzolan | glass_powder | steel_slag | other
  oxides:                       # wt%. SiO2는 필수, 나머지는 측정된 것만. 합이 100±3 밖이면 정규화됨.
    SiO2: "?"
    CaO: "?"
    Al2O3: "?"
    Fe2O3: "?"
    MgO: "?"
    SO3: "?"
    Na2O: "?"
    K2O: "?"
    TiO2: null                  # InverseGems 슬롯에는 들어가지 않음(기록·유사배합 검색용)
    LOI: null                   # 강열감량. 합계 계산에서 제외
  blaine_m2_kg: null            # 분말도 (m2/kg). GBM 예측에 사용
  d50_um: null                  # 중앙 입경 (µm)
  bet_m2_g: null                # BET 비표면적 (m2/g)
  amorphous_pct: null           # 비정질 함량 %. 측정값(PONKCS/내부표준 XRD 등)만. 100−Σ결정상 계산값 금지
  density_kg_m3: null           # 밀도. 없으면 슬롯 기본값(슬래그 2900, 플라이애시 2200 …)

# ---------- 2. 배합 (필수) ----------
mix:
  scm_pct: "?"                    # 결합재 중 SCM 질량 % (0–100)
  w_b: "?"                        # 물/결합재 비
  curing_temp_C: 20             # 양생 온도 °C
  opc_oxides: null              # 시멘트 조성을 알면 {CaO: 63.3, SiO2: 20.2, Al2O3: 5.0, Fe2O3: 3.0, MgO: 1.8, SO3: 3.0, Na2O: 0.2, K2O: 0.8}
                                # 없으면 InverseGems 기본 CEM I 42.5 조성 사용
  other_components: {}          # 추가 성분 질량 % (결합재 기준). 예: {limestone: 5, gypsum: 3}

# ---------- 3. 예측 재령 (선택) ----------
ages_d: [1, 3, 7, 28, 90, 180, 365]

# ---------- 4. 관측값 (선택; 검증·역추정용) ----------
# quantity: CH_TGA | CH_XRD | bound_water | chem_shrink | QXRD_phase | DoR_SCM | DoR_clinker
# unit    : 반드시 '기준'이 드러나게 적을 것. 인정되는 표기 예
#   질량량(CH, 결합수): "g/100 g binder"(A) | "g/100 g cement"(A, 시멘트 기준→환산) | "g/100 g clinker"(B)
#                     | "g/100 g paste"(C, 큰 가정) | "%" 또는 "wt%"만 적으면 D(참고용, 통계 제외)
#   화학수축         : "mL/g binder"(A) | "mL/100 g binder"(A) | "mm3/g binder"(A) | "%"는 D
#   반응도           : "%" 또는 "fraction"
#   QXRD_phase       : "wt% (as reported)" + phase_name 필수 (portlandite, ettringite, monocarbonate,
#                      hemicarbonate, monosulfate, calcite, hydrotalcite, straetlingite, alite, belite …)
# method  : 측정법 텍스트(선택). 예: "TGA 105-1000C", "selective dissolution (EDTA)", "SEM-BSE", "29Si NMR"
# uncertainty : 같은 단위의 표준편차(선택). 없으면 기본값(CH 1.5, 결합수 1.5 g/100 g, 화학수축 0.005 mL/g)
observations:
  - {age_d: 7,  quantity: bound_water, value: "?", unit: "g/100 g binder", method: "TGA 105-1000C"}
  - {age_d: 28, quantity: bound_water, value: "?", unit: "g/100 g binder", method: "TGA 105-1000C"}
  - {age_d: 28, quantity: CH_TGA,      value: "?", unit: "g/100 g binder", method: "TGA"}
  - {age_d: 28, quantity: chem_shrink, value: "?", unit: "mL/g binder"}
  # - {age_d: 28, quantity: QXRD_phase, value: "?", unit: "wt% (as reported)", phase_name: ettringite}
  # - {age_d: 28, quantity: DoR_SCM,    value: "?", unit: "%", method: "selective dissolution"}   # 있으면 검증에만 사용

# ---------- 5. 메모 (선택; 결과 manifest에 그대로 기록) ----------
notes: ""
source: ""                      # 데이터 출처(보고서·실험 ID·DOI 등)
